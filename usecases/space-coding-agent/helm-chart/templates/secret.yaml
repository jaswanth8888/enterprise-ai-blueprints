apiVersion: v1
kind: Secret
metadata:
  name: {{ include "space-coding-agent.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "space-coding-agent.labels" . | nindent 4 }}
type: Opaque
data:
  OPENAI_API_KEY: {{ required "agent.openaiApiKey is required" .Values.agent.openaiApiKey | b64enc | quote }}
  APP_AUTH_TOKEN: {{ required "agent.appAuthToken is required" .Values.agent.appAuthToken | b64enc | quote }}
  E2B_API_KEY: {{ required "space.e2bApiKey is required (Secret space/space-api-key, key E2B_API_KEY)" .Values.space.e2bApiKey | b64enc | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.agent.langfusePublicKey | b64enc | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.agent.langfuseSecretKey | b64enc | quote }}
