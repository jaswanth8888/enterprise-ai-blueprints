{{- if .Values.httpRoute.enabled }}
{{- $fullname := include "space-coding-agent.fullname" . }}
# UI, API and SSE through the platform's Envoy Gateway; TLS ends at its https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "space-coding-agent.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      {{- with .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httpRoute.timeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.agent.port }}
{{- end }}
